name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repo. Declaring it here
# means the run does not inherit whatever the repo/org default happens to be.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Windows / Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Later steps run PR-authored code (`pip install -e .` executes
          # setup hooks, then pytest). checkout persists the token in git
          # config by default, which that code could read — nothing here
          # needs authenticated git, so don't persist it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src/meshchat

      - name: Test
        # The Qt widgets under test need a display; the offscreen platform
        # plugin gives them one without a real desktop session.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
