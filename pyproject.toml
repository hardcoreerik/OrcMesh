[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshchat-windows"
version = "0.1.0"
description = "Native Windows desktop client and network monitor for Meshtastic mesh radio networks"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
    "meshtastic>=2.5.0,<3",
    "PySide6>=6.7,<7",
    "PyPubSub>=4.0",          # used directly by meshtastic and our controller
    "platformdirs>=4,<5",
    "pyqtgraph>=0.13",
    "numpy>=1.26",
]

[project.scripts]
meshchat = "meshchat.app:main"

[project.optional-dependencies]
# RTL-SDR spectrum waterfall. Also needs the native librtlsdr driver — on
# Windows, install the WinUSB driver for the dongle with Zadig. MeshChat runs
# normally without this; the Spectrum page just reports it as unavailable.
sdr = [
    "pyrtlsdr>=0.3",
]
dev = [
    "pytest>=8,<10",
    "pytest-timeout>=2,<3",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

# Include the Leaflet web assets in the installed package
[tool.setuptools.package-data]
"meshchat.ui.map" = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
timeout = 30

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Qt/Meshtastic imports are deliberately deferred until after logging and the
# QApplication are configured, so module-level-import-not-at-top is expected.
"src/meshchat/__main__.py" = ["E402"]
# Tests must instantiate QCoreApplication before importing Qt-dependent modules.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
